[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "gpx2img"
version = "0.1.0"
description = "Generate Zepp OS watch map tiles (11/x/y.img) from a GPX route."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gpxpy>=1.6.2",
  "fastapi>=0.100.0",
  "uvicorn>=0.22.0",
  "python-multipart>=0.0.6",
  "httpx>=0.27.0",
  "shapely>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "starlette>=0.27.0",
]

[project.scripts]
gpx2img = "gpx2img.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
